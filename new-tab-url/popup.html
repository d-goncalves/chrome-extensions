<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; background: #000; color: #ddd; }
    h2 { margin: 0 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #666; }
    input { box-sizing: border-box; width: 100%; padding: 9px; margin-bottom: 8px; border: 1px solid #333; border-radius: 8px; background: #111; color: #eee; font: inherit; }
    input:focus { outline: none; border-color: #666; }
    button { width: 100%; padding: 9px; border: 1px solid #333; border-radius: 8px; background: #111; color: #eee; font: inherit; cursor: pointer; }
    button:hover { background: #1c1c1c; }
    #status { min-height: 16px; margin: 8px 0 0; font-size: 12px; color: #777; }
    #status.error { color: #f55; }
  </style>
</head>
<body>
  <h2>New tab page</h2>
  <form id="form">
    <input id="url" type="text" placeholder="https://example.com" spellcheck="false" autocomplete="off">
    <button>Save</button>
  </form>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
