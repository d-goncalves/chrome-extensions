<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; background: #000; color: #ddd; }
    p { margin: 0 0 10px; color: #999; }
    p b { color: #fff; font-weight: 600; }
    button { width: 100%; padding: 9px; border: 1px solid #333; border-radius: 8px; background: #111; color: #eee; font: inherit; cursor: pointer; }
    button:hover { background: #1c1c1c; }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; }
    h2 { margin: 18px 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #666; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #1a1a1a; }
    li button { width: auto; padding: 0 6px; border: none; background: none; color: #777; font-size: 16px; }
    li button:hover { color: #f55; background: none; }
    .empty { color: #555; }
  </style>
</head>
<body>
  <div id="view"></div>
  <h2>Blocked sites</h2>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
